[package]
name = "swiftbeam-core"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "2.0"
tokio = { version = "1.38", features = ["fs", "sync", "rt", "macros"] }
memmap2 = "0.9"
blake3 = "1.5"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.10"

