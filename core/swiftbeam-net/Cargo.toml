[package]
name = "swiftbeam-net"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1.38", features = ["full"] }
quinn = "0.11"
rustls = { version = "0.23", features = ["ring", "std"] }
rcgen = "0.13" # Self-signed certificates for QUIC
mdns-sd = "0.7" # mDNS discovery
swiftbeam-core = { path = "../swiftbeam-core" }
swiftbeam-crypto = { path = "../swiftbeam-crypto" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
memmap2 = "0.9"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1.8", features = ["v4", "fast-rng", "macro-diagnostics"] }
tracing = "0.1"
if-addrs = "0.10"
[dev-dependencies]
tempfile = "3.10"
