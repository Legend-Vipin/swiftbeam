name: CI — SwiftBeam Monorepo

on:
  push:
    branches: ['main', 'dev', 'feature/**', 'fix/**']
  pull_request:
    branches: ['main', 'dev', 'feature/**', 'fix/**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PKG_CONFIG_ALLOW_CROSS: "1"

jobs:
  ci:
    name: Local CI Runner (Rust + Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Add Cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache cargo flutter_rust_bridge_codegen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/
          key: ${{ runner.os }}-cargo-frb-codegen-2.12.0

      - name: Install flutter_rust_bridge_codegen & set permissions
        run: |
          chmod +x $HOME/.cargo/bin/* 2>/dev/null || true
          if ! command -v flutter_rust_bridge_codegen &> /dev/null; then
            cargo install flutter_rust_bridge_codegen --version 2.12.0 --force
          fi
          chmod +x $HOME/.cargo/bin/* 2>/dev/null || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config clang cmake libgtk-3-dev dpkg-dev

      - name: Install Flutter packages
        run: |
          cd apps/mobile && flutter pub get

      - name: Run Full CI via Python Tooling Layer
        run: python3 tools/ci.py
