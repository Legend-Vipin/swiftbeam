name: CI — SwiftBeam Monorepo

on:
  push:
    branches: ['main', 'dev', 'feature/**', 'fix/**']
  pull_request:
    branches: ['main', 'dev', 'feature/**', 'fix/**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PKG_CONFIG_ALLOW_CROSS: "1"

jobs:
  ci:
    name: Local CI Runner (Rust + Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config clang cmake libgtk-3-dev dpkg-dev

      - name: Install Flutter packages
        run: |
          cd apps/mobile && flutter pub get

      - name: Run Full CI via Python Tooling Layer
        run: python3 tools/ci.py
