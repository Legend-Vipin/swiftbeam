name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PKG_CONFIG_ALLOW_CROSS: "1"

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust (stable) with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
          components: rustfmt, clippy

      - name: Add Cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache Cargo binaries
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/
          key: ${{ runner.os }}-cargo-tools-v1

      - name: Install FFI Codegen & NDK linking tools
        run: |
          chmod +x $HOME/.cargo/bin/* 2>/dev/null || true
          if ! command -v flutter_rust_bridge_codegen &> /dev/null; then
            cargo install flutter_rust_bridge_codegen --version 2.12.0 --force
          fi
          if ! command -v cargo-ndk &> /dev/null; then
            cargo install cargo-ndk
          fi
          chmod +x $HOME/.cargo/bin/* 2>/dev/null || true
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config clang cmake libgtk-3-dev dpkg-dev

      - name: Install Flutter packages & link dependencies
        run: |
          cd apps/mobile && flutter pub get

      - name: Run FFI Codegen verification & binding
        run: |
          python3 tools/codegen.py

      - name: Run Release via Python Tooling Layer
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VER="${{ github.ref_name }}"
            TAG_VER="${TAG_VER#v}"
            python3 tools/release.py --version "$TAG_VER" --skip-ci
          else
            python3 tools/release.py --skip-ci
          fi

      - name: Publish GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: SwiftBeam ${{ github.ref_name }}
          body: |
            ## SwiftBeam Release ${{ github.ref_name }}

            📦 **Android APK** — Download `swiftbeam-*-release.apk` below.
            🌍 **Universal macOS & Linux Tarball** — Download `swiftbeam-*-universal-multiarch.tar.gz` for multi-arch support.
            📄 **Release Manifest** — See `release_manifest.json` for SHA256 checksums and file sizes.
          files: |
            dist/swiftbeam-*-release.apk
            dist/swiftbeam-*-universal-multiarch.tar.gz
            dist/release_manifest.json
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
